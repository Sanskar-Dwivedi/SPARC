openapi: 3.1.0
info:
  title: SPARC API
  version: 1.1.0-alpha.1
  summary: Contract-first API for satellite-derived local environmental proxy indicators.
  description: |
    The read-only P0 demo API is implemented over immutable contract examples; live raster
    processing and administrative job creation remain disabled.
    SPARC results are satellite-derived proxy indicators, not official UN SDG indicators,
    and do not establish causation. `loading` is a browser state; server resources use
    queued, running, complete, partial, failed, or cancelled states.

    Validation duties that remain authoritative server responsibilities:

    1. Identifier patterns constrain shape only. IDs are resolved through approved catalogues,
       never concatenated into filesystem paths or outbound URLs.
    2. Calendar dates are parsed as real dates and checked for ordering, supported archive
       bounds, maximum span, and period compatibility before any I/O.
    3. Public comparison requests resolve bounded precomputed results only. They cannot queue
       anonymous live processing and remain subject to request-size, concurrency, and rate limits.
    4. Problem responses never include stack traces, filesystem paths, environment values,
       internal hostnames, credentials, tokens, signed URLs, or raw provider responses.

    Forecast endpoints are read-only and currently serve a versioned prototype
    pack. Their probabilities are transparent baseline estimates and are not
    calibrated official warnings.
  contact:
    name: SPARC contract owner
  license:
    name: Project license not yet selected
    identifier: LicenseRef-SPARC-Undecided
servers:
  - url: http://localhost:8000
    description: Planned local development API
  - url: https://api.example.invalid
    description: Non-routable documentation placeholder; cloud hosting is undecided
tags:
  - name: Health
  - name: Regions
  - name: Indicators
  - name: Forecasts
  - name: Comparisons
  - name: Layers
  - name: Processing
  - name: Metadata
  - name: Reporting
security: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Return cheap process liveness without calling dependencies.
      x-sparc-maturity: required-p0
      responses:
        '200':
          description: Process is alive. No credential or detailed configuration is returned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status, version, dataMode]
                properties:
                  status:
                    type: string
                    const: ok
                  version:
                    type: string
                  dataMode:
                    type: string
                    enum: [live, cache, demo]
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/regions:
    get:
      operationId: listRegions
      tags: [Regions]
      summary: List available districts and child regions with capabilities.
      x-sparc-maturity: required-p0
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [district, subdistrict, block]
        - name: parentId
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)*$'
      responses:
        '200':
          description: Region references; large geometries are linked rather than embedded.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta, links]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/RegionRef'
                  meta:
                    $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ResponseMeta'
                  links:
                    $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/Links'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/regions/{regionId}:
    get:
      operationId: getRegion
      tags: [Regions]
      summary: Return one region, its parent/children links, bounds, and capabilities.
      x-sparc-maturity: required-p0
      parameters:
        - $ref: '#/components/parameters/RegionId'
      responses:
        '200':
          description: Region metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta, links]
                properties:
                  data:
                    $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/RegionRef'
                  meta:
                    $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ResponseMeta'
                  links:
                    $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/Links'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/regions/{regionId}/forecast-runs:
    get:
      operationId: listForecastRuns
      tags: [Forecasts]
      summary: List published forecast runs for a region.
      description: Returns immutable run metadata for the flood, drought, and heat prototype products.
      x-sparc-maturity: implemented-prototype
      parameters:
        - $ref: '#/components/parameters/RegionId'
        - name: hazard
          in: query
          required: false
          schema:
            $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ForecastHazard'
      responses:
        '200':
          description: Published forecast-run metadata.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ForecastRunListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/regions/{regionId}/forecasts/{hazard}/latest:
    get:
      operationId: getLatestForecast
      tags: [Forecasts]
      summary: Return the latest published forecast for one hazard.
      description: The response contains horizon points, separate probability and confidence fields, drivers, provenance, and limitations.
      x-sparc-maturity: implemented-prototype
      parameters:
        - $ref: '#/components/parameters/RegionId'
        - $ref: '#/components/parameters/ForecastHazard'
      responses:
        '200':
          description: Latest forecast run.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ForecastRunResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/regions/{regionId}/forecasts/{hazard}/{runId}:
    get:
      operationId: getForecastRun
      tags: [Forecasts]
      summary: Return one immutable forecast run.
      x-sparc-maturity: implemented-prototype
      parameters:
        - $ref: '#/components/parameters/RegionId'
        - $ref: '#/components/parameters/ForecastHazard'
        - $ref: '#/components/parameters/ForecastRunId'
      responses:
        '200':
          description: Forecast run with all supported horizons.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ForecastRunResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/regions/{regionId}/forecasts/{hazard}/{runId}/timeseries:
    get:
      operationId: getForecastTimeSeries
      tags: [Forecasts]
      summary: Return the horizon series for one immutable forecast run.
      x-sparc-maturity: implemented-prototype
      parameters:
        - $ref: '#/components/parameters/RegionId'
        - $ref: '#/components/parameters/ForecastHazard'
        - $ref: '#/components/parameters/ForecastRunId'
      responses:
        '200':
          description: Forecast probability and metric time series.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ForecastTimeSeriesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/regions/{regionId}/summary:
    get:
      operationId: getRegionSummary
      tags: [Regions, Indicators]
      summary: Return a district or child-region summary for two supported periods.
      x-sparc-maturity: required-p0
      parameters:
        - $ref: '#/components/parameters/RegionId'
        - $ref: '#/components/parameters/BaselineStart'
        - $ref: '#/components/parameters/BaselineEnd'
        - $ref: '#/components/parameters/ComparisonStart'
        - $ref: '#/components/parameters/ComparisonEnd'
      responses:
        '200':
          description: Complete or usable partial summary. Inspect `meta.partial` and warnings.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/DistrictSummaryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/regions/{regionId}/indicators:
    get:
      operationId: listRegionIndicators
      tags: [Indicators]
      summary: List supported indicator results for a region and period pair.
      x-sparc-maturity: required-p0
      parameters:
        - $ref: '#/components/parameters/RegionId'
        - $ref: '#/components/parameters/BaselineStart'
        - $ref: '#/components/parameters/BaselineEnd'
        - $ref: '#/components/parameters/ComparisonStart'
        - $ref: '#/components/parameters/ComparisonEnd'
        - name: indicatorId
          in: query
          required: false
          schema:
            $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/IndicatorId'
      responses:
        '200':
          description: Summary list; an unavailable indicator is explicit rather than silently omitted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta, links]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/IndicatorSummary'
                  meta:
                    $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ResponseMeta'
                  links:
                    $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/Links'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/regions/{regionId}/indicators/{indicatorId}:
    get:
      operationId: getRegionIndicator
      tags: [Indicators]
      summary: Return one detailed indicator comparison, quality, provenance, interpretation, and layers.
      x-sparc-maturity: required-p0
      parameters:
        - $ref: '#/components/parameters/RegionId'
        - $ref: '#/components/parameters/IndicatorId'
        - $ref: '#/components/parameters/BaselineStart'
        - $ref: '#/components/parameters/BaselineEnd'
        - $ref: '#/components/parameters/ComparisonStart'
        - $ref: '#/components/parameters/ComparisonEnd'
      responses:
        '200':
          description: Detailed complete or partial result.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/IndicatorComparisonResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/regions/{regionId}/timeseries:
    get:
      operationId: getRegionTimeSeries
      tags: [Indicators]
      summary: Return a same-method time series for one indicator.
      x-sparc-maturity: planned-p1
      parameters:
        - $ref: '#/components/parameters/RegionId'
        - name: indicatorId
          in: query
          required: true
          schema:
            $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/IndicatorId'
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
            maxLength: 10
            pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
            maxLength: 10
            pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      responses:
        '200':
          description: Time series with provenance.
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/TimeSeriesResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/comparisons:
    post:
      operationId: createComparison
      tags: [Comparisons]
      summary: Resolve a supported comparison or accept restricted live work.
      description: |
        The normal UI operation. Only approved region IDs, indicators, and bounded periods are accepted.
        The operation cannot receive an arbitrary AOI, upstream URL, local path, expression, or command.
      x-sparc-maturity: required-p0
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ComparisonRequest'
      responses:
        '200':
          description: Immutable demo/cache summary was available immediately.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/DistrictSummaryResponse'
        '202':
          description: Future live work was accepted. Poll the Location resource.
          headers:
            Location:
              required: true
              schema:
                type: string
                maxLength: 240
                pattern: '^/api/v1/processing/jobs/[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)*$'
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/JobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/comparisons/{comparisonId}:
    get:
      operationId: getComparison
      tags: [Comparisons]
      summary: Return the current comparison summary.
      x-sparc-maturity: required-p0
      parameters:
        - $ref: '#/components/parameters/ComparisonId'
      responses:
        '200':
          description: Complete or usable partial comparison summary.
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/DistrictSummaryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/processing/jobs:
    post:
      operationId: createProcessingJob
      tags: [Processing]
      summary: Create an approved processing recipe job.
      description: |
        P1 administrative endpoint. It is disabled in P0. It accepts only named approved recipes
        and catalogued regions; arbitrary URLs, paths, commands, code, and free-form geometries are forbidden.
      x-sparc-maturity: planned-p1-restricted
      security:
        - AdminToken: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [regionId, recipeId, baselinePeriod, comparisonPeriod]
              properties:
                regionId:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)*$'
                recipeId:
                  type: string
                  enum: [surface-water-v1, vegetation-v1, built-up-v1, lst-v1]
                baselinePeriod:
                  $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/PeriodInput'
                comparisonPeriod:
                  $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/PeriodInput'
      responses:
        '202':
          description: Approved work was queued.
          headers:
            Location:
              required: true
              schema:
                type: string
                maxLength: 240
                pattern: '^/api/v1/processing/jobs/[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)*$'
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/JobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/processing/jobs/{jobId}:
    get:
      operationId: getProcessingJob
      tags: [Processing]
      summary: Return safe status for a known processing job.
      x-sparc-maturity: planned-p1
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job resource. Failed jobs still return a resource with `status=failed`.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/JobResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/layers/{layerId}:
    get:
      operationId: getLayer
      tags: [Layers]
      summary: Resolve an opaque allowlisted layer descriptor.
      description: The endpoint never accepts an upstream URL and never exposes provider credentials or transient signed URLs.
      x-sparc-maturity: required-p0
      parameters:
        - $ref: '#/components/parameters/LayerId'
      responses:
        '200':
          description: Layer descriptor using relative application URLs.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/LayerResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/layers/{layerId}/tilejson.json:
    get:
      operationId: getLayerTileJson
      tags: [Layers]
      summary: Return TileJSON for an approved layer.
      x-sparc-maturity: planned-p1
      parameters:
        - $ref: '#/components/parameters/LayerId'
      responses:
        '200':
          description: Restricted TileJSON with application-controlled tile templates.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [tilejson, name, tiles, bounds, minzoom, maxzoom, attribution]
                properties:
                  tilejson:
                    type: string
                    const: 3.0.0
                  name:
                    type: string
                    minLength: 1
                    maxLength: 160
                  tiles:
                    type: array
                    minItems: 1
                    maxItems: 8
                    items:
                      type: string
                      maxLength: 400
                      description: Application-controlled relative tile template; never an upstream or caller URL.
                      pattern: '^/api/v1/[A-Za-z0-9{][A-Za-z0-9._~:{}-]*(?:/[A-Za-z0-9{][A-Za-z0-9._~:{}-]*)*$'
                  bounds:
                    $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/Bbox'
                  minzoom:
                    type: integer
                    minimum: 0
                    maximum: 24
                  maxzoom:
                    type: integer
                    minimum: 0
                    maximum: 24
                  attribution:
                    type: string
                    maxLength: 500
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/metadata/datasets:
    get:
      operationId: listDatasets
      tags: [Metadata]
      summary: List source datasets, citations, licenses, and supported roles.
      x-sparc-maturity: required-p0
      responses:
        '200':
          description: Dataset metadata. It contains stable source/catalog identities only.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta, links]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/DatasetSource'
                  meta:
                    $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ResponseMeta'
                  links:
                    $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/Links'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/metadata/indicators:
    get:
      operationId: listIndicatorMetadata
      tags: [Metadata, Indicators]
      summary: List indicator definitions, versions, units, direction, and proxy labels.
      x-sparc-maturity: required-p0
      responses:
        '200':
          description: Indicator metadata.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta, links]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/IndicatorRef'
                  meta:
                    $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ResponseMeta'
                  links:
                    $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/Links'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/reports:
    post:
      operationId: createReport
      tags: [Reporting]
      summary: Create a bounded, claim-safe environmental concern report.
      description: |
        P0 is an offline-first local path. It generates a neutral inspection or
        verification request and never submits to an authority, bypasses CAPTCHA/OTP,
        or stores government credentials. Multipart uploads are bounded and local-only.
        `geminiConsent` is explicit. When enabled, the server sends only selected
        non-identifying report text and analysis context to the configured Gemini
        provider; complainant details, contacts, attachments, exact coordinates,
        signature and date are appended locally after drafting. An optional
        JPEG or PDF signature upload is retained in the evidence package;
        JPEG signatures are also placed in the generated PDF.
      x-sparc-maturity: mock-p0
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ReportCreate'
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [report]
              properties:
                report:
                  type: string
                  description: JSON-encoded ReportCreate object.
                attachments:
                  type: array
                  maxItems: 6
                  items:
                    type: string
                    format: binary
                signature:
                  type: string
                  format: binary
                  description: Optional JPEG or PDF signature uploaded separately from evidence attachments.
      responses:
        '201':
          description: Report created in ephemeral P0 storage.
          headers:
            Location:
              schema: { type: string, maxLength: 400, pattern: '^(?:/(?!/)|\./)[A-Za-z0-9][A-Za-z0-9._~:-]*(?:/[A-Za-z0-9][A-Za-z0-9._~:-]*)*$' }
            X-Report-Access:
              schema: { type: string, minLength: 32, maxLength: 128 }
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ReportResponse'
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/reports/{reportId}:
    get:
      operationId: getReport
      tags: [Reporting]
      summary: Read an ephemeral report by opaque ID.
      x-sparc-maturity: mock-p0
      security:
        - ReportAccess: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/ReportAccess'
      responses:
        '200':
          description: Report state and artifact metadata.
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ReportResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

    delete:
      operationId: deleteReport
      tags: [Reporting]
      summary: Delete an ephemeral report and its artifacts.
      description: P0 local deletion; durable authenticated deletion is a later phase.
      x-sparc-maturity: mock-p0
      security:
        - ReportAccess: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/ReportAccess'
      responses:
        '204': { description: Report deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/reports/{reportId}/artifacts/{artifactId}:
    get:
      operationId: getReportArtifact
      tags: [Reporting]
      summary: Download a verified PDF or ZIP artifact.
      x-sparc-maturity: mock-p0
      security:
        - ReportAccess: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - name: artifactId
          in: path
          required: true
          schema: { type: string, enum: [pdf, zip] }
        - $ref: '#/components/parameters/ReportAccess'
      responses:
        '200':
          description: Verified artifact bytes.
          content:
            application/pdf: { schema: { type: string, format: binary } }
            application/zip: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

  /api/v1/reports/{reportId}/submit-handoff:
    post:
      operationId: submitReportHandoff
      tags: [Reporting]
      summary: Record a user's manual handoff to an allowlisted official portal.
      description: SPARC returns an official URL but never submits, proxies, scrapes, or automates portal controls.
      x-sparc-maturity: mock-p0
      security:
        - ReportAccess: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/ReportAccess'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [authorityId, confirmReview]
              properties:
                authorityId: { type: string, minLength: 2, maxLength: 80, pattern: '^[a-z0-9-]+$' }
                confirmReview: { type: boolean, const: true }
      responses:
        '200':
          description: Handoff recorded without external submission.
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ReportResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/reports/{reportId}/acknowledgement:
    post:
      operationId: acknowledgeReport
      tags: [Reporting]
      summary: Store a user-entered external acknowledgement.
      description: SPARC does not verify the external reference or claim that an authority accepted the report.
      x-sparc-maturity: mock-p0
      security:
        - ReportAccess: []
      parameters:
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/ReportAccess'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [authorityId, status, confirmedUserEntered]
              properties:
                authorityId: { type: string, minLength: 2, maxLength: 80, pattern: '^[a-z0-9-]+$' }
                status: { type: string, enum: [SUBMITTED, NOT_SUBMITTED, UNKNOWN] }
                externalReference: { type: [string, 'null'], maxLength: 160 }
                submittedAt: { type: [string, 'null'], format: date-time, maxLength: 35 }
                confirmedUserEntered: { type: boolean, const: true }
      responses:
        '200':
          description: User-entered acknowledgement stored.
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ReportResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /api/v1/authorities:
    get:
      operationId: listAuthorities
      tags: [Reporting]
      summary: List the versioned manual-handoff authority registry.
      x-sparc-maturity: mock-p0
      parameters:
        - name: issueCode
          in: query
          required: false
          schema: { type: string, maxLength: 80, pattern: '^[a-z0-9]+(?:\.[a-z0-9_]+)+$' }
      responses:
        '200':
          description: Allowlisted authorities and source metadata.
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/AuthorityListResponse'

  /api/v1/jurisdictions:
    get:
      operationId: listJurisdictions
      tags: [Reporting]
      summary: List the limited verified jurisdiction packs and coverage states.
      description: The registry is not global coverage. Unsupported locations remain export-only and never receive guessed authorities.
      x-sparc-maturity: mock-p0
      parameters:
        - name: countryCode
          in: query
          required: false
          schema: { type: string, pattern: '^[A-Z]{2}$' }
      responses:
        '200':
          description: Versioned jurisdiction-pack records.
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/JurisdictionListResponse'

  /api/v1/authorities/{authorityId}:
    get:
      operationId: getAuthority
      tags: [Reporting]
      summary: Read one versioned manual-handoff authority record.
      x-sparc-maturity: mock-p0
      parameters:
        - name: authorityId
          in: path
          required: true
          schema: { type: string, minLength: 2, maxLength: 80, pattern: '^[a-z0-9-]+$' }
      responses:
        '200':
          description: Authority record.
          content:
            application/json:
              schema:
                $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/AuthorityResponse'
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    AdminToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-admin-token
      description: Planned P1 server-side administrative credential; never stored in browser code.
    ReportAccess:
      type: apiKey
      in: header
      name: X-Report-Access
      description: Short-lived opaque P0 report capability token; never a government credential and never placed in a URL.
  headers:
    ETag:
      description: Strong or weak validator for immutable result content.
      schema:
        type: string
  parameters:
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        minLength: 39
        maxLength: 80
        pattern: '^report:[a-f0-9]{32}$'
    ReportAccess:
      name: X-Report-Access
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]{32,128}$'
    RegionId:
      name: regionId
      in: path
      required: true
      description: Opaque catalogue identifier. A matching pattern is not authorization for filesystem or network access.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)*$'
    ForecastHazard:
      name: hazard
      in: path
      required: true
      description: Forecast hazard resolved through the published hazard catalogue.
      schema:
        $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ForecastHazard'
    ForecastRunId:
      name: runId
      in: path
      required: true
      description: Opaque immutable forecast-run identifier.
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)*$'
    IndicatorId:
      name: indicatorId
      in: path
      required: true
      schema:
        $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/IndicatorId'
    ComparisonId:
      name: comparisonId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)*$'
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)*$'
    LayerId:
      name: layerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*(?::[a-z0-9]+(?:-[a-z0-9]+)*)*$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Opaque client key; reuse with a different body returns 409.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    BaselineStart:
      name: baselineStart
      in: query
      required: true
      schema:
        type: string
        format: date
        maxLength: 10
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    BaselineEnd:
      name: baselineEnd
      in: query
      required: true
      schema:
        type: string
        format: date
        maxLength: 10
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    ComparisonStart:
      name: comparisonStart
      in: query
      required: true
      schema:
        type: string
        format: date
        maxLength: 10
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    ComparisonEnd:
      name: comparisonEnd
      in: query
      required: true
      schema:
        type: string
        format: date
        maxLength: 10
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
  responses:
    BadRequest:
      description: Malformed syntax, query, or JSON.
      content:
        application/problem+json:
          schema:
            $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ProblemDetails'
    Unauthorized:
      description: Required authentication is absent or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ProblemDetails'
    Forbidden:
      description: The authenticated principal is not permitted to perform the operation.
      content:
        application/problem+json:
          schema:
            $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ProblemDetails'
    NotFound:
      description: A requested region, comparison, layer, job, or result does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ProblemDetails'
    Gone:
      description: The requested transient resource existed but has expired.
      content:
        application/problem+json:
          schema:
            $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ProblemDetails'
    Conflict:
      description: State or idempotency-key conflict.
      content:
        application/problem+json:
          schema:
            $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ProblemDetails'
    UnprocessableEntity:
      description: Well-formed input violates schema or domain rules.
      content:
        application/problem+json:
          schema:
            $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ProblemDetails'
    PayloadTooLarge:
      description: The request body exceeds the configured server limit.
      content:
        application/problem+json:
          schema:
            $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ProblemDetails'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ProblemDetails'
    InternalError:
      description: Unexpected server failure; raw exceptions and secrets are not returned.
      content:
        application/problem+json:
          schema:
            $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ProblemDetails'
    BadGateway:
      description: An approved upstream provider returned an invalid or failed response.
      content:
        application/problem+json:
          schema:
            $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ProblemDetails'
    ServiceUnavailable:
      description: Required upstream or service capacity is temporarily unavailable.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '../packages/contracts/schemas/sparc.schema.json#/$defs/ProblemDetails'
